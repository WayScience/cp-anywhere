[package]
name = "cp_anywhere_python"
description = "Python bindings for cp-anywhere."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# Produces the native extension module imported from Python as
# `cp_anywhere._native` (see `module-name` in pyproject.toml).
name = "_native"
crate-type = ["cdylib"]

[dependencies]
cp_anywhere_core = { path = "../cp_anywhere_core" }
cp_anywhere_segmentation = { path = "../cp_anywhere_segmentation" }
# `abi3-py311` builds against CPython's stable ABI, so a single wheel per
# platform works on Python 3.11 and every newer version -- no per-interpreter
# build matrix, and forward compatibility with Python versions released after
# this pyo3.
pyo3 = { workspace = true, features = ["extension-module", "abi3-py311"] }
numpy = "0.29"
