---
# used for publishing the core measurement crate to crates.io on release
name: publish crates.io release
on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish_crate:
    name: publish cp_anywhere_core to crates.io
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
      - name: Sync package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: python tools/sync_release_version.py "$RELEASE_TAG"
      # Only cp_anywhere_core is published: it is the portable,
      # dependency-free measurement kernel usable from any Rust project.
      # cp_anywhere_python and cp_anywhere_wasm are thin FFI bindings
      # consumed through PyPI and npm respectively, not as Cargo
      # dependencies.
      - name: Publish cp_anywhere_core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path crates/cp_anywhere_core/Cargo.toml
