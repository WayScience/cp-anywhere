---
# Publish the full Rust library to crates.io on release.
name: publish crates.io release
on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish_crate:
    name: publish cp-anywhere to crates.io
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
      - name: Sync package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: python tools/sync_release_version.py "$RELEASE_TAG"
      # cp-anywhere includes segmentation, measurements, illumination,
      # and pipeline execution. The bindings ship through PyPI and npm.
      - name: Publish cp-anywhere
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # The version-sync step intentionally edits the manifest and lockfile.
        run: cargo publish --locked --allow-dirty -p cp-anywhere
