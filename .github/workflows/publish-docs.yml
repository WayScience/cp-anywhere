---
# used for publishing documentation on push to main or published release
name: publish docs

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    # only build and deploy docs if the actor is not dependabot
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      # uv syncs (and builds the native extension) during the docs build
      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the browser demo runtime
        run: python scripts/wasm/build_package.py
      - name: Build documentation
        run: |
          mkdir pages
          touch pages/.nojekyll
          uv run --frozen --group docs sphinx-build -d docs/_build/doctrees \
            docs/src pages
          uv run --frozen python scripts/wasm/stage_docs_demo.py pages
      - name: Deploy documentation
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: pages
          folder: pages
          # Pin the push target: the action otherwise derives it from the
          # event payload's repository.full_name, which stayed stale at
          # d33bs/cp-anywhere after the transfer to the wayscience org.
          repository-name: wayscience/cp-anywhere
