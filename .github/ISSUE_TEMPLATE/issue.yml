name: Bug report or feature request
description: Report a problem or suggest an improvement to cp-anywhere.

body:
  - type: markdown
    attributes:
      value: >
        Search existing issues before opening a new one. For security
        vulnerabilities, use GitHub's private reporting form instead:
        https://github.com/d33bs/cp-anywhere/security/advisories/new

  - type: textarea
    id: description
    attributes:
      label: What happened or what would you like to change?
      description: >
        Describe the problem or proposed change and the result you expect.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce the problem?
      description: >
        Include the version or commit, your platform, a minimal example,
        and any error message. For a compatibility problem, include the
        CellProfiler version and the settings or pipeline you used.
