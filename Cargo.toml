[workspace]
members = [
  "crates/cp_anywhere",
  "crates/cp_anywhere_python",
  "crates/cp_anywhere_wasm",
]
resolver = "2"

[workspace.package]
# The workspace version is the single source of truth for the built wheel.
#
# Unlike the pure-Python variant of this template (which derives its version
# dynamically from git tags via setuptools-scm), maturin reads the package
# version from Cargo. `tools/sync_release_version.py` rewrites the line below
# from the release tag at publish time, so a tagged release of `vX.Y.Z`
# produces a wheel versioned `X.Y.Z`. Between releases this stays at the last
# released value (or your chosen development version).
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause AND BSL-1.0"
repository = "https://github.com/wayscience/cp-anywhere"
rust-version = "1.82"

[workspace.dependencies]
pyo3 = "0.29"

# Size-optimized release profile for the WASM target only; native crates
# (core, PyO3 bindings) keep Cargo's default release profile for best
# native throughput. `lto`/`panic`/`rpath` cannot be set per-package, so
# only `opt-level` is overridden here; `wasm-pack`'s bundled `wasm-opt`
# pass does further size optimization on the built binary.
[profile.release.package.cp-anywhere-wasm]
opt-level = "s"
