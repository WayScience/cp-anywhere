[build-system]
build-backend = "maturin"
requires = [ "maturin>=1.9,<2" ]

[project]
name = "cp-anywhere"
description = "CellProfiler-compatible measurements for native Python and web browsers"
readme = "README.md"
authors = [
  { name = "Dave Bunten" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "numpy>=1.26",
  "pandas>=2",
  "pillow>=10",
  "pyarrow>=14",
  "tifffile>=2024.1",
]
# Optional: only needed for MeasurementResult.to_duckdb(). Parquet
# (to_parquet) and SQLite STRICT tables (to_sqlite) need no extra
# dependency -- pyarrow is already a core dependency, and SQLite is
# Python's own stdlib sqlite3 module.
optional-dependencies.duckdb = [ "duckdb>=1.1" ]
urls.Documentation = "https://wayscience.github.io/cp-anywhere/"
urls.Issues = "https://github.com/wayscience/cp-anywhere/issues"
urls.Source = "https://github.com/wayscience/cp-anywhere"
scripts.cp-anywhere = "cp_anywhere.cli:trigger"

[dependency-groups]
dev = [
  "coverage[toml]>=7.10.6",
  "duckdb>=1.1",
  "maturin>=1.9,<2",
  "poethepoet>=0.34",
  "pytest>=8.3.5",
  "pytest-cov>=6.2.1",
  "pyyaml>=6,<7",
]
docs = [
  "matplotlib>=3.9",
  "myst-nb>=1.2",
  "pydata-sphinx-theme>=0.16.1",
  "sphinx>=8.2.3",
]
# Asset-generation and native-validation tooling for the Zarr/ONNX/DuckDB
# browser integration demo (examples/zarr-onnx-duckdb/). Not needed to
# build, test, or use cp-anywhere itself -- only to regenerate or verify
# that one example's fixture assets.
demo-assets = [
  "duckdb>=1.1",
  "onnx>=1.17",
]

[tool.maturin]
# Build the native extension as "cp_anywhere._native" alongside the
# pure-Python package that lives under src/. The Rust sources live in a Cargo
# workspace under crates/; the bindings crate is the maturin entry point.
module-name = "cp_anywhere._native"
python-source = "src"
manifest-path = "crates/cp_anywhere_python/Cargo.toml"
include = [
  { path = "LICENSE", format = "sdist" },
  { path = "crates/cp_anywhere/LICENSE-centrosome", format = [ "sdist", "wheel" ] },
]
features = [ "pyo3/extension-module" ]

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
lint.select = [
  # flake8-builtins
  "A",
  # flake8-annotations
  "ANN",
  # flake8-comprehensions
  "C4",
  # mccabe
  "C90",
  # pycodestyle
  "E",
  # pyflakes
  "F",
  # isort
  "I",
  # pylint
  "PL",
  # ruff
  "RUF",
  # flake8-simplify
  "SIM",
  "W",
]
# Ignore `F401` (unused imports) for `__init__.py` file
lint.per-file-ignores."__init__.py" = [ "F401" ]
# Ignore `PLR0913`: build_pipeline's keyword-only options
# (measure/wants_excluded/distance_method/test_image) each gate a
# distinct, independently-added MeasureObjectNeighbors fixture
# variant; splitting them into a settings object would not simplify
# anything over named keywords here.
lint.per-file-ignores."scripts/cppipe/generate_fixtures.py" = [ "PLR0913" ]
# Ignore `PLC0415` (deferred `functools`/skimage-adapter import, reference-
# environment-only) and `ANN401` (the selem->footprint compatibility
# shim forwards arbitrary skimage.morphology call signatures, so its
# wrapper is necessarily untyped) for the granularity pipeline generator.
lint.per-file-ignores."scripts/cppipe/generate_granularity_pipeline.py" = [
  "ANN401",
  "PLC0415",
]
# Ignore `E501` (the pinned-wheel install lines in the module docstring
# cannot be wrapped) and `ANN001`/`ANN201`/`ANN202` (this finished,
# verified conversion script keeps its loose signatures; it is not part
# of the shipped package) for the InstanSeg model conversion script.
lint.per-file-ignores."scripts/instanseg/convert.py" = [
  "ANN001",
  "ANN201",
  "ANN202",
  "E501",
  "F841",
  "PLC0415",
]
# Ignore `PLC0415`: this M2 comparison script imports `cp_measure` lazily
# because it is not a project dependency -- it only exists in the
# separate, isolated comparison environment this script is run inside.
lint.per-file-ignores."scripts/parity/compare_cp_measure.py" = [ "PLC0415" ]
# Ignore `PLC0415` (deferred skimage import, kept out of the reference
# generator's module scope since it's a reference-environment-only
# dependency) and `PLR0917` (measure() intentionally threads every golden
# fixture's inputs through as named positional values matching the
# original CellProfiler Workspace construction, not a function to shrink)
# for the reference generator script.
lint.per-file-ignores."scripts/reference/generate.py" = [ "PLC0415", "PLR0917" ]
# Ignore `PLR0913` (_default_settings intentionally exposes every
# MeasureColocalization setting this generator exercises as a named
# keyword, matching the real module's own Settings surface) and
# `PLR0915` (cases()/generate() are long by nature -- one yield per
# fixture case, one real-pipeline-run step per case -- splitting them
# would obscure the 1:1 correspondence with CellProfiler's own run(),
# not simplify anything) for the colocalization reference generator.
lint.per-file-ignores."scripts/reference/generate_colocalization.py" = [
  "PLR0913",
  "PLR0915",
]
# Ignore `PLC0415` (deferred CellProfiler/skimage imports, reference-
# environment-only), `PLR0913`/`PLR0917` (configure_module/fixture
# kwargs intentionally mirror every Threshold/IdentifyPrimaryObjects
# setting this generator exercises), `C901`/`PLR0912`/`PLR0915` (both
# `configure_module` and `fixture_cases` are long, branchy functions by
# nature -- one Setting-mapping branch per threshold method, one yield
# per fixture case -- splitting them would obscure the 1:1 correspondence
# with CellProfiler's own Settings surface, not simplify anything) for
# the segmentation reference generator script.
lint.per-file-ignores."scripts/segmentation/generate_reference.py" = [
  "C901",
  "PLC0415",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
]
# Ignore `PLC0415` (import not at top-level) for `api.py`, which defers the
# native extension import so the pure-Python package stays importable, and
# `PLR0913` (measure()'s parameters are each an independent, named part of
# its public contract -- images/objects/mask/families/neighbors_scopes/
# neighbors_full_objects -- not incidental complexity to shrink).
lint.per-file-ignores."src/cp_anywhere/api.py" = [ "PLC0415", "PLR0913" ]
# Ignore `PLC0415` (deferred native-extension import, same reason as
# api.py) and `PLR0913` (measure_colocalization's keyword arguments
# each name one of MeasureColocalization's own CellProfiler settings,
# not a function to shrink).
lint.per-file-ignores."src/cp_anywhere/colocalization.py" = [
  "PLC0415",
  "PLR0913",
]
# Ignore `PLC0415` (deferred native-extension import, same reason as
# api.py) and `PLR0913` (measure_granularity's keyword arguments each
# name one of MeasureGranularity's own CellProfiler settings, not a
# function to shrink) for the granularity API.
lint.per-file-ignores."src/cp_anywhere/granularity.py" = [ "PLC0415", "PLR0913" ]
# Ignore `PLC0415` (deferred native-extension import, same reason as
# api.py) and `PLR0913` (calculate_illumination's keyword arguments
# each name one of CorrectIlluminationCalculate's own CellProfiler
# settings, not a function to shrink).
lint.per-file-ignores."src/cp_anywhere/illumination.py" = [
  "PLC0415",
  "PLR0913",
]
# Ignore `PLC0415` (deferred native-extension import, same reason as
# api.py) and `PLR0913` (measure_intensity_distribution's keyword
# arguments each name one of MeasureObjectIntensityDistribution's own
# CellProfiler settings, not a function to shrink).
lint.per-file-ignores."src/cp_anywhere/intensity_distribution.py" = [
  "PLC0415",
  "PLR0913",
]
# Ignore `PLC0415` for `io.py`, which defers `tifffile`/`PIL`/`pandas`
# imports so loading one file format doesn't require the others, and
# `measure_files` stays usable without pandas imported at module load.
lint.per-file-ignores."src/cp_anywhere/io.py" = [ "PLC0415" ]
# Ignore `PLC0415` (deferred native-extension import, same reason as
# api.py) and `PLR0913` (QcProfile.from_criteria's keyword arguments
# each name one independent profile property -- name/version/criteria/
# combination/blur_scale/source -- not a function to shrink).
lint.per-file-ignores."src/cp_anywhere/quality.py" = [ "PLC0415", "PLR0913" ]
# Ignore `PLC0415` for `save_images.py`, same reason as `io.py` above:
# defers `tifffile`/`PIL` imports so writing one file format doesn't
# require the other.
lint.per-file-ignores."src/cp_anywhere/save_images.py" = [ "PLC0415" ]
# Ignore `PLC0415` (deferred native-extension import, same reason as
# api.py), `PLR0913` (identify_primary_objects intentionally exposes
# every IdentifyPrimaryObjects/Threshold setting this release covers as
# a named keyword argument, matching CellProfiler's own Settings surface,
# not a function to shrink), and `PLR0911` (_resolve_threshold's one
# `return` per supported threshold-method name is the clearest mapping,
# not a function to shrink) for the segmentation API.
lint.per-file-ignores."src/cp_anywhere/segment.py" = [ "PLC0415", "PLR0911", "PLR0913" ]
# Ignore `PLC0415` (deferred native-extension import, same reason as
# api.py) and `PLR0913` (measure_texture's keyword arguments each name
# one of MeasureTexture's own CellProfiler settings, not a function to
# shrink).
lint.per-file-ignores."src/cp_anywhere/texture.py" = [ "PLC0415", "PLR0913" ]

[tool.vulture]
paths = [ "src/cp_anywhere", "tests" ]
min_confidence = 90

[tool.pytest]
ini_options.pythonpath = [ "." ]
ini_options.addopts = [
  "--cov=cp_anywhere",
  "--cov-report=term-missing",
  "--cov-report=xml",
]

[tool.coverage]
run.source = [ "src/cp_anywhere" ]
run.branch = true
report.skip_covered = true
report.show_missing = true

[tool.poe]
# tasks for development environments
# build the native extension into the active environment
tasks.develop.shell = """
maturin develop --uv
"""
# run the Rust unit tests
tasks.rust-test.shell = """
cargo test
"""
# rebuild the extension, then run the Python tests
tasks.test.shell = """
maturin develop --uv && pytest
"""
# Exercise the opt-in pipeline with the real model, not the feature-off skips.
tasks.test-stardist.shell = """
cargo test --locked -p cp-anywhere --features stardist-model stardist &&
maturin develop --uv --locked --features stardist-model &&
python -c 'from cp_anywhere._native import stardist_segment' &&
pytest --no-cov tests/quality/test_autosegment.py -k stardist
"""
# Exercise the opt-in InstanSeg pipeline with the real model, not the
# feature-off skips.
tasks.test-instanseg.shell = """
cargo test --locked -p cp-anywhere --features instanseg-model instanseg &&
maturin develop --uv --locked --features instanseg-model &&
python -c 'from cp_anywhere._native import instanseg_segment' &&
pytest --no-cov tests/quality/test_autosegment.py -k instanseg
"""
# Exercise the opt-in SplineDist pipeline with the real model, not the
# feature-off skips.
tasks.test-splinedist.shell = """
cargo test --locked -p cp-anywhere --features splinedist-model splinedist &&
maturin develop --uv --locked --features splinedist-model &&
python -c 'from cp_anywhere._native import splinedist_segment' &&
pytest --no-cov tests/quality/test_autosegment.py -k splinedist
"""
tasks.lint.shell = """
pre-commit run --all-files
"""
# requires the web WASM build and Playwright Chromium; see docs/cppipe.md
tasks.cppipe-parity.cmd = "python -m scripts.parity.compare_cppipe"
# full local pipeline: Rust tests, native build, linting, Python tests
tasks.pipeline.shell = """
cargo test && maturin develop --uv && pre-commit run --all-files && pytest
"""
